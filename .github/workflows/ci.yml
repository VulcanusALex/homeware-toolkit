name: ci

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile everything
        run: python -m py_compile home_gateway_toolkit/*.py home_gateway_toolkit/drivers/*.py tools/*.py home-gateway
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        run: |
          ./home-gateway --version
          ./home-gateway --help >/dev/null
          ./home-gateway probe --help >/dev/null
          ./home-gateway setup --help >/dev/null
          ./home-gateway doctor --help >/dev/null
          ./home-gateway session --help >/dev/null
          ./home-gateway ssh --help >/dev/null
          ./home-gateway ssh run --help >/dev/null
          ./home-gateway fw --help >/dev/null
          ./home-gateway inbound observe --help >/dev/null
          ./home-gateway support-bundle --help >/dev/null
          ./home-gateway audit-update --help >/dev/null
          ./home-gateway wanwatch --help >/dev/null
          python tools/home_gateway_probe.py --help >/dev/null
          python tools/home_gateway_ssh.py --help >/dev/null
      - name: Import graph check
        run: |
          python -c "
          import home_gateway_toolkit.cli, home_gateway_toolkit.doctor, home_gateway_toolkit.firewall
          import home_gateway_toolkit.audit, home_gateway_toolkit.egress, home_gateway_toolkit.inbound
          import home_gateway_toolkit.setup
          import home_gateway_toolkit.support
          import home_gateway_toolkit.inject, home_gateway_toolkit.probe, home_gateway_toolkit.ssh
          import home_gateway_toolkit.transfer, home_gateway_toolkit.verify, home_gateway_toolkit.wanwatch
          import home_gateway_toolkit.drivers, home_gateway_toolkit.drivers.nexxt
          import home_gateway_toolkit.drivers.openwrt, home_gateway_toolkit.drivers.vcnt_i
          import home_gateway_toolkit.simulator, home_gateway_toolkit.wizard, home_gateway_toolkit.tui
          print('imports OK')"
