name: ci

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile everything
        run: python -m py_compile homeware_toolkit/*.py homeware_toolkit/drivers/*.py tools/*.py homeware
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        run: |
          ./homeware --version
          ./homeware --help >/dev/null
          ./homeware probe --help >/dev/null
          ./homeware setup --help >/dev/null
          ./homeware doctor --help >/dev/null
          ./homeware session --help >/dev/null
          ./homeware ssh --help >/dev/null
          ./homeware ssh run --help >/dev/null
          ./homeware fw --help >/dev/null
          ./homeware inbound observe --help >/dev/null
          ./homeware support-bundle --help >/dev/null
          ./homeware audit-update --help >/dev/null
          ./homeware wanwatch --help >/dev/null
          python tools/homeware_probe.py --help >/dev/null
          python tools/homeware_ssh.py --help >/dev/null
      - name: Import graph check
        run: |
          python -c "
          import homeware_toolkit.cli, homeware_toolkit.doctor, homeware_toolkit.firewall
          import homeware_toolkit.audit, homeware_toolkit.egress, homeware_toolkit.inbound
          import homeware_toolkit.setup
          import homeware_toolkit.support
          import homeware_toolkit.inject, homeware_toolkit.probe, homeware_toolkit.ssh
          import homeware_toolkit.transfer, homeware_toolkit.verify, homeware_toolkit.wanwatch
          import homeware_toolkit.drivers, homeware_toolkit.drivers.nexxt
          import homeware_toolkit.drivers.openwrt, homeware_toolkit.drivers.vcnt_i
          import homeware_toolkit.simulator, homeware_toolkit.wizard, homeware_toolkit.tui
          print('imports OK')"
