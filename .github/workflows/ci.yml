name: ci

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile everything
        run: python -m py_compile nexxt_toolkit/*.py tools/*.py nexxt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        run: |
          ./nexxt --version
          ./nexxt --help >/dev/null
          ./nexxt probe --help >/dev/null
          ./nexxt doctor --help >/dev/null
          ./nexxt session --help >/dev/null
          ./nexxt ssh --help >/dev/null
          ./nexxt ssh run --help >/dev/null
          ./nexxt fw --help >/dev/null
          ./nexxt wanwatch --help >/dev/null
          python tools/nexxt_probe.py --help >/dev/null
          python tools/nexxt_ssh.py --help >/dev/null
      - name: Import graph check
        run: |
          python -c "
          import nexxt_toolkit.cli, nexxt_toolkit.doctor, nexxt_toolkit.firewall
          import nexxt_toolkit.inject, nexxt_toolkit.probe, nexxt_toolkit.ssh
          import nexxt_toolkit.transfer, nexxt_toolkit.verify, nexxt_toolkit.wanwatch
          print('imports OK')"
