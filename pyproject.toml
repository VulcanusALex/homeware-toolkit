[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexxt-one-toolkit"
version = "1.6.0"
description = "Owner-side toolkit for the Fastweb NeXXt One gateway: guided setup, safe key-only SSH, firewall and inbound diagnostics, upgrade audits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "VulcanusALex"}]
keywords = ["fastweb", "nexxt", "fga221d", "gdnt-s", "router", "ssh", "ipv6", "6rd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/VulcanusALex/nexxt-one-toolkit"
Documentation = "https://github.com/VulcanusALex/nexxt-one-toolkit/tree/main/docs"
Issues = "https://github.com/VulcanusALex/nexxt-one-toolkit/issues"

[project.scripts]
nexxt = "nexxt_toolkit.cli:main"

[tool.setuptools]
packages = ["nexxt_toolkit"]

[tool.setuptools.package-data]
nexxt_toolkit = ["compat.json"]
