[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homeware-toolkit"
version = "1.6.0"
description = "Owner-side toolkit for Technicolor/Vantiva Homeware gateways (ISP-locked routers): guided setup, safe key-only SSH, firewall and inbound diagnostics, upgrade audits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "VulcanusALex"}]
keywords = ["homeware", "technicolor", "vantiva", "fastweb", "vodafone", "nexxt", "fga221d", "gdnt-s", "router", "gateway", "ssh", "ipv6", "6rd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/VulcanusALex/homeware-toolkit"
Documentation = "https://github.com/VulcanusALex/homeware-toolkit/tree/main/docs"
Issues = "https://github.com/VulcanusALex/homeware-toolkit/issues"

[project.scripts]
homeware = "homeware_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["homeware_toolkit*"]

[tool.setuptools.package-data]
homeware_toolkit = ["compat.json"]
